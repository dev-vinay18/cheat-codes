       PODS

apiVersion: v1
kind: Pod
metadata:
  name: mypod
  labels:
    app: nginx

spec:
  containers:
    name: nginx
    image: nginx:latest
    ports:
      containerPort: 80

      SERVICES

apiVersion: v1
kind: Service
metadata:
  name: clusterip
spec:
  selector:
    app: nginx
  ports:
      protocol: TCP
      port: 80
      targetPort: 80

apiVersion: v1
kind: Service
metadata:
  name: nodeport
spec:
  selector:
    app: nginx
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 31000

apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
spec:
  selector:
    app: nginx
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9376   

apiVersion: v1
kind: ReplicationController
metadata:
  name: rc
spec: 
  replicas: 5
  selector:
    type: frontend
  templete: 
      metadata:
        name: my-pod
        labels:
          type: frontend
      spec:
        container: 
        - name: nginx
          image: nginx:latest
          ports:
             - containerPort: 80

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs
spec: 
  selector:
    matchExpressions:
                - {key: type, operator: In, values: ["frontend"]}
  replicas: 5
  template: 
      metadata:
        name: my-pod
        labels:
          type: frontend
      spec:
        containers: 
        - name: nginx
          image: nginx:latest
          ports:
             - containerport: 80